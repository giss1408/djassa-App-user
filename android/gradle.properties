org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Bundle ML Kit's barcode model in the app (false = bundled). The unbundled
# model is downloaded by Google Play services on the phone at first use;
# until that finishes -- which may be never on a phone with little data or no
# Google services -- the camera shows but no QR is ever recognised. Bundled
# costs about 1 MB compressed per APK and works at once, offline.
dev.steenbakker.mobile_scanner.useUnbundled=false
