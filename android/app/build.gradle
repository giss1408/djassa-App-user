plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing is read from android/key.properties (gitignored; written by
// CI from secrets, see .github/workflows/release.yml). Without it a release
// build is unsigned on purpose: never the debug key, whose public keystore
// would let anyone publish an "update" that replaces this app on a phone.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "ci.fidelia.fidelia_user"
    // mobile_scanner 6 (CameraX 1.5) compiles against API 36; Flutter 3.24's
    // default is 34. compileSdk only unlocks APIs, it does not change runtime
    // behaviour (that is targetSdk).
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "ci.fidelia.fidelia_user"
        // 23: CameraX 1.5 (mobile_scanner) requires Android 6+.
        minSdk = 23
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Ship only the languages we translate: drops AndroidX's strings for
        // every other language, as the merchant app does.
        resourceConfigurations += ["fr", "en"]
    }

    // One APK per ABI keeps each download small on a prepaid bundle; the
    // universal APK is for anyone unsure which phone they have. Shared by a
    // link on WhatsApp (see fidelia-Web /app).
    splits {
        abi {
            enable = true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk = true
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : null
            // No customer handset is x86; debug builds keep every ABI so the
            // emulator still works.
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
            // Never ship a debuggable release.
            debuggable = false
            // Code shrinking stays off for now: the camera/QR stack
            // (mobile_scanner, ML Kit) needs keep rules that have not been
            // written and tested yet.
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    packagingOptions {
        // Compress the native libraries (Flutter engine, compiled Dart) inside
        // the APK. The APK is shared as a download on WhatsApp and every update
        // is a full download on a prepaid bundle, so this halves what testers
        // pay for (measured: 17.6 MB -> 8.8 MB for arm64). The cost: Android
        // unpacks the libraries at install, about 8 MB more storage and a few
        // seconds more to install. Revisit when distributing through the Play
        // Store, which compresses and splits downloads itself.
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source = "../.."
}
